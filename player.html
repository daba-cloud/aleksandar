<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Player</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* GLAVNI KONTEJNER */
        .video-kontejner {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            gap: 20px;
        }

        /* OKVIR ZA PLEJER */
        .plejer-okvir {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 80vh;
            background-color: #050505; 
            
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03), inset 0 0 20px rgba(255, 255, 255, 0.01);
            
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; /* Ovo je ključno za pozicioniranje teksta */
        }

        /* Sam video element */
        .plejer-okvir video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* Tekst za izbor fajla - sada je unutar okvira, na dnu desno */
        .unos-fajla {
            position: absolute; /* Apsolutno pozicioniran unutar okvira */
            bottom: 15px; /* Odmaknut od donje ivice */
            right: 20px; /* Odmaknut od desne ivice */
            display: flex;
            align-items: center;
            z-index: 10; /* Iznad videa */
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); /* Tankа linija ispod teksta */
            padding-bottom: 5px;
        }

        /* Sakrivamo ružno default dugme za izbor fajla */
        input[type="file"] {
            display: none;
        }

        /* Stiliziramo labelu */
        .label-fajl {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5); /* Malo providnije da ne smeta videu */
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            outline: none;
            text-transform: lowercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: color 0.3s ease;
            text-align: right;
            white-space: nowrap; /* Sprečava prelamanje teksta u više redova */
        }

        .label-fajl:hover, .label-fajl:active {
            color: #ffffff;
        }

        /* Prilagođavanje za mobilne telefone */
        @media (max-width: 600px) {
            .video-kontejner {
                padding: 10px;
                gap: 10px;
            }
            .unos-fajla {
                bottom: 10px;
                right: 10px;
            }
            .label-fajl {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="video-kontejner">
        <!-- Plejer sa ugrađenim tekstom za izbor fajla -->
        <div class="plejer-okvir" id="plejer">
            <video id="lokalni-video" controls></video>
            
            <!-- Tekst je sada unutar plejera, na dnu desno -->
            <div class="unos-fajla">
                <input type="file" id="izbor-fajla" accept="video/*">
                <label for="izbor-fajla" class="label-fajl">select video from device</label>
            </div>
        </div>
    </div>

    <script>
        const izborFajla = document.getElementById('izbor-fajla');
        const lokalniVideo = document.getElementById('lokalni-video');

        // Kada korisnik izabere fajl, učitavamo ga u video plejer
        izborFajla.addEventListener('change', function(event) {
            const fajl = event.target.files[0]; 
            
            if (fajl) {
                const urlFajla = URL.createObjectURL(fajl);
                lokalniVideo.src = urlFajla;
                lokalniVideo.play();
            }
        });
    </script>

</body>
</html>
