<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Player</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* GLAVNI KONTEJNER */
        .video-kontejner {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centriramo sve po sredini */
            padding: 20px;
            gap: 20px;
        }

        /* OKVIR ZA PLEJER - BEZ IKAKVIH LINIJA */
        .plejer-okvir {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 80vh;
            background-color: #000000;
            /* Nema bordera, nema senke, nema ničega */
            border: none;
            box-shadow: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .plejer-okvir video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* DUGME "OPEN" ISPOD VIDEJA */
        .dugme-open {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3); /* Vrlo providno, da bude diskretno */
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            letter-spacing: 8px; /* Veliki razmak između slova */
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
            padding: 10px 20px;
            margin-top: 10px;
        }

        .dugme-open:hover, .dugme-open:active {
            color: #ffffff;
        }

        /* Sakrivamo input za fajl */
        input[type="file"] {
            display: none;
        }

        /* Prilagođavanje za mobilne */
        @media (max-width: 600px) {
            .video-kontejner {
                padding: 10px;
            }
            .dugme-open {
                font-size: 14px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="video-kontejner">
        <!-- Plejer bez linija -->
        <div class="plejer-okvir">
            <video id="lokalni-video" controls></video>
        </div>

        <!-- Dugme OPEN ispod videa -->
        <input type="file" id="izbor-fajla" accept="video/*">
        <label for="izbor-fajla" class="dugme-open">OPEN</label>
    </div>

    <script>
        const izborFajla = document.getElementById('izbor-fajla');
        const lokalniVideo = document.getElementById('lokalni-video');

        izborFajla.addEventListener('change', function(event) {
            const fajl = event.target.files[0]; 
            
            if (fajl) {
                const urlFajla = URL.createObjectURL(fajl);
                lokalniVideo.src = urlFajla;
                lokalniVideo.play();
            }
        });
    </script>

</body>
</html>
