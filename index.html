<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOKUS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="zaglavlje">
        <!-- LEVA STRANA: Tri crtice (Hamburger meni) -->
        <div class="leva-strana">
            <span class="crtice">&#9776;</span>
        </div>

        <!-- SREDINA: FOKUS Logo -->
        <div class="logo-fokus">
            <span>F</span>
            <span>O</span>
            <span>K</span>
            <span>U</span>
            <span>S</span>
        </div>

        <!-- DESNA STRANA: Covek (Profil) -->
        <div class="desna-strana">
            <svg viewBox="0 0 24 24" class="ikona-covek" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
    </header>

    <!-- GLAVNI SADRŽAJ -->
    <main class="feed-container">
        
        <!-- 1. VIDEO OBJAVA (YouTube 16:9) -->
        <div class="post">
            <!-- Zaglavlje objave -->
            <div class="post-header">
                <div class="post-avatar">R</div>
                <div class="post-info">
                    <span class="post-name">RTS</span>
                    <span class="post-time">pre 1 sat</span>
                </div>
            </div>
            
            <!-- Naslov i tekst -->
            <div class="post-title">Prenos sa javnog servisa</div>
            <div class="post-excerpt">Ekskluzivni snimak drona sa lica mesta donosi nove detalje.</div>
            
            <!-- YouTube Video (16:9) -->
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>
            
            <!-- Akcije (Podeli i Izvor) -->
            <div class="post-actions">
                <a href="#" class="action-btn">
                    <svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"></path></svg>
                    <span>Podeli</span>
                </a>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="action-btn">
                    <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"></path></svg>
                    <span>Izvor</span>
                </a>
            </div>
        </div>

        <!-- 2. TEKSTUALNA VEST (Samo tekst, bez videa) -->
        <div class="post vest-post">
            <div class="post-header">
                <div class="post-avatar">N</div>
                <div class="post-info">
                    <span class="post-name">N1</span>
                    <span class="post-time">pre 3 sata</span>
                </div>
            </div>
            <div class="post-title">Studenti objavili nove zahteve</div>
            <div class="post-excerpt">Nakon višečasovne sednice, studenti su predstavili nove zahteve koji se tiču ispitnih rokova i finansiranja.</div>
            <div class="post-actions">
                <a href="#" class="action-btn">
                    <svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"></path></svg>
                    <span>Podeli</span>
                </a>
                <a href="https://n1info.rs" target="_blank" class="action-btn">
                    <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"></path></svg>
                    <span>Izvor</span>
                </a>
            </div>
        </div>

    </main>

</body>
</html>
