<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* GLAVNI ZAGLAVLJE */
        .zaglavlje {
            display: flex;
            flex-direction: column; /* Redja elemente jedan ispod drugog */
            align-items: center; /* Centrira sve po sredini */
            width: 100%;
            padding-top: 30px; /* Razmak od vrha ekrana */
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); /* TANKA LINIJA ISPOD */
        }

        /* NASLOV (Gornji red) */
        .ime-monaha {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 12px; /* Veći razmak između slova */
            color: #ffffff;
            margin: 0 0 25px 0; /* Razmak ispod naslova do menija */
            padding-left: 12px; /* Centriranje zbog letter-spacing */
        }

        /* KONTEJNER ZA NAVIGACIJU (Donji red) */
        .dugmad-kontejner {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center; /* Centrirano */
            gap: 30px; /* Razmak između reči */
            padding-bottom: 20px; /* Razmak od reči do donje linije */
        }

        /* STIL ZA SVE LINKOVE U MENIJU */
        .dugmad-kontejner a {
            display: inline-block;
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 2px;
            transition: color 0.3s ease;
            background-color: transparent;
            padding: 5px 0;
            position: relative;
        }

        /* Efekat na hover */
        .dugmad-kontejner a:hover, .dugmad-kontejner a:active {
            color: #ffffff;
        }

        /* Bela linija ispod reči na hover */
        .dugmad-kontejner a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px;
            bottom: -3px;
            left: 0;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .dugmad-kontejner a:hover::after {
            width: 100%;
        }

        /* Ostatak stranice (ispod zaglavlja) ostaje prazan */
        .prazan-prostor {
            flex: 1;
        }

        /* Prilagođavanje za mobilne telefone */
        @media (max-width: 600px) {
            .ime-monaha {
                font-size: 32px;
                letter-spacing: 8px;
                margin-bottom: 15px;
            }
            .dugmad-kontejner {
                gap: 15px;
            }
            .dugmad-kontejner a {
                font-size: 13px;
            }
        }

    </style>
</head>
<body>

    <!-- Zaglavlje sa linijom ispod -->
    <div class="zaglavlje">
        <!-- Naslov u prvom redu -->
        <h1 class="ime-monaha">Aleksandar</h1>
        
        <!-- Meni u drugom redu -->
        <div class="dugmad-kontejner">
            <a href="ulaz.html">Portal</a>
            <a href="video.html">YouTube</a>
            <a href="player.html">Video</a>
            <a href="chat.html">Chat</a>
            <a href="#">Blog</a>
            <a href="#">News</a>
            <a href="tekst.html">Notes</a>
            <a href="audio.html">Audio</a>
        </div>
    </div>

    <!-- Ostatak ekrana je prazan (crn) -->
    <div class="prazan-prostor"></div>

</body>
</html>
