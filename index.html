<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelena</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Prva stranica */
        #pocetna {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            gap: 30px;
        }

        .video-kontejner {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .video-kontejner iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #jelena-dugme {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #jelena-dugme:active {
            transform: scale(0.95);
            background-color: #cccccc;
        }

        /* Druga stranica - crna sa porukom */
        #poruka {
            display: none;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            background-color: #000000;
            padding: 20px;
            text-align: center;
        }

        #poruka.aktivna {
            display: flex;
        }

        #poruka p {
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0;
            animation: pojaviSe 0.8s ease;
        }

        @keyframes pojaviSe {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- PRVA STRANICA: video + dugme -->
    <div id="pocetna">
        <div class="video-kontejner">
            <iframe
                src="https://www.youtube.com/embed/zeQC5w7QVls?controls=1&rel=0"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <button id="jelena-dugme" onclick="prikaziPoruku()">JELENA</button>
    </div>

    <!-- DRUGA STRANICA: crna sa porukom -->
    <div id="poruka">
        <p>OBOZAVAM TE :)</p>
    </div>

    <script>
        function prikaziPoruku() {
            document.getElementById("pocetna").style.display = "none";
            document.getElementById("poruka").classList.add("aktivna");
        }
    </script>

</body>
</html>
