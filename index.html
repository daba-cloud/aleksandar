<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Helvetica:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* --- ZAGLAVLJE (NASLOV + LINIJA + MENI) --- */
        .zaglavlje {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 20px;
            
            /* DODATA JE OVA GORNJA DEBELA LINIJA */
            border-top: 3px solid #ffffff; 
            
            border-bottom: 1px solid #ffffff; 
        }

        /* NASLOV */
        .ime-monaha {
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 12px; 
            color: #ffffff;
            margin: 0 0 20px 0;
            padding-left: 12px;
            text-align: center;
        }

        /* GLAVNI MENI */
        .dugmad-kontejner {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            padding: 15px 40px;
            gap: 40px;
        }

        .dugmad-kontejner a {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            transition: opacity 0.3s ease;
            background-color: transparent;
            padding: 5px 0;
            position: relative;
            cursor: pointer;
            white-space: nowrap; 
        }

        .dugmad-kontejner a:hover {
            opacity: 0.6; 
        }

        .dugmad-kontejner a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px;
            bottom: -3px;
            left: 0;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .dugmad-kontejner a:hover::after {
            width: 100%;
        }

        /* --- DONJI DEO --- */
        .donji-deo {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
        }

        /* Početni prikaz (Kontakt i Email) */
        .pocetni-prikaz {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            padding: 40px 8%;
            margin-top: 60px;
        }

        .kolona {
            width: 45%; 
        }

        .kolona h3 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .kolona p {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1.6;
            color: #ffffff;
            text-transform: none; 
        }

        .kolona a {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Polje za email */
        .email-unos {
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 5px;
            margin-top: 15px;
        }

        .email-unos input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            letter-spacing: 1px;
            text-transform: lowercase; 
        }

        .email-unos input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            text-transform: none;
        }

        .email-unos button {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 0 10px;
        }

        /* --- DINAMIČKI SADRŽAJ --- */
        .dinamicki-sadrzaj {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            padding: 20px 8%;
            display: none; 
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
        }

        .dinamicki-sadrzaj.aktivan {
            display: flex;
        }

        .close-dugme {
            align-self: flex-end;
            background: transparent;
            border: none;
            color: #888888;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        .close-dugme:hover {
            color: #ffffff;
        }

        .dinamicki-sadrzaj h2 {
            font-size: 24px;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .dinamicki-sadrzaj p {
            font-size: 15px;
            line-height: 1.6;
            color: #cccccc;
            text-transform: none;
        }

        .video-okvir {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #111;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .video-okvir iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- DRUGA LINIJA I DRUŠTVENE MREŽE --- */
        .druga-linija {
            width: 100%;
            height: 1px;
            background-color: #ffffff;
            margin-top: auto; 
        }

        .drustvene-mreze {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 15px 40px;
            background-color: #000000;
        }

        .drustvene-mreze a {
            color: #ffffff;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drustvene-mreze a:hover {
            opacity: 0.5;
        }

        .drustvene-mreze svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Prilagođavanje za mobilne telefone */
        @media (max-width: 600px) {
            .ime-monaha { font-size: 28px; letter-spacing: 8px; margin-bottom: 15px; }
            .dugmad-kontejner { gap: 15px; padding: 15px; }
            .dugmad-kontejner a { font-size: 10px; }
            .pocetni-prikaz { flex-direction: column; gap: 40px; padding: 30px 5%; margin-top: 30px; }
            .kolona { width: 100%; }
            .drustvene-mreze { justify-content: center; padding: 15px 0; gap: 25px; }
            .drustvene-mreze svg { width: 18px; height: 18px; }
            .dinamicki-sadrzaj { padding: 20px 5%; }
        }

    </style>
</head>

        <div class="pocetni-prikaz" id="pocetni-prikaz">
            <div class="kolona">
                <h3>CONTACT</h3>
                <p>
                    Ako imaš bilo kakvo pitanje ili predlog, slobodno mi piši na <a href="mailto:aleksandar@email.com">aleksandar@email.com</a>. 
                    Uvek sam dostupan za saradnju i razgovor.
                </p>
            </div>

            <div class="kolona">
                <h3>NEWSLETTER</h3>
                <p>Prijavi se da budeš u toku sa najnovijim sadržajem.</p>
                <div class="email-unos">
                    <input type="email" placeholder="enter your email address" aria-label="Email">
                    <button type="button">OK</button>
                </div>
            </div>
        </div>
        
        <div class="dinamicki-sadrzaj" id="dinamicki-sadrzaj">
            <button class="close-dugme" onclick="zatvoriSadrzaj()">CLOSE ✕</button>

        </div>

        <div class="druga-linija"></div>

    </div>

    <script>
        function prikaziSadrzaj(tip) {
            const pocetniPrikaz = document.getElementById('pocetni-prikaz');
            const dinamickiSadrzaj = document.getElementById('dinamicki-sadrzaj');
            const sadrzajUnutra = document.getElementById('sadrzaj-unutra');

            pocetniPrikaz.style.display = 'none';
            dinamickiSadrzaj.classList.add('aktivan');

            if (tip === 'blog') {
                sadrzajUnutra.innerHTML = `
                    <h2>BLOG</h2>
                    <p>Dobrodošli na moj blog. Ovde ću deliti svoje misli, ideje i zanimljivosti. Sadržaj uskoro stiže...</p>
                `;
            } else if (tip === 'news') {
                sadrzajUnutra.innerHTML = `
                    <h2>NEWS</h2>
                    <div class="video-okvir">
                        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0" 
                            title="YouTube video" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                `;
            }
        }

        function zatvoriSadrzaj() {
            const pocetniPrikaz = document.getElementById('pocetni-prikaz');
            const dinamickiSadrzaj = document.getElementById('dinamicki-sadrzaj');

            dinamickiSadrzaj.classList.remove('aktivan');
            pocetniPrikaz.style.display = 'flex';
            
            document.getElementById('sadrzaj-unutra').innerHTML = '';
        }
    </script>

</body>
