<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PRVA STRANICA: video + dugme -->
    <div id="pocetna">
        <div class="video-kontejner">
            <iframe
                id="yt-plejer"
                src="https://www.youtube.com/embed/4f569AodkkQ?controls=1&rel=0&enablejsapi=1"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <button id="jelena-dugme" onclick="prikaziPoruku()">
            <span class="tekst-dugmeta">KLIKNI JELENA</span>
        </button>
    </div>

    <!-- DRUGA STRANICA: crna sa porukom -->
    <div id="poruka">
        <div class="srce">❤</div>
        <p id="tekst-poruke"></p>
        <div class="srce">❤</div>
        <button id="nazad-dugme" onclick="prikaziTrecu()">Vrati se</button>
    </div>

    <!-- TREĆA STRANICA: drugi video + dugme -->
    <div id="treca">
        <div class="video-kontejner">
            <iframe
                src="https://www.youtube.com/embed/5q9pY_2Gp30?controls=1&rel=0&enablejsapi=1"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <button id="brat-dugme">
            <span class="tekst-dugmeta">LJUBI TE BRAT</span>
        </button>
    </div>

    <!-- Kontejner za srca koja padaju -->
    <div id="srca-padaju"></div>

    <script>
        /* ===== PORUKA KOJA KUCА SLOVO PO SLOVO ===== */
        const PORUKA = "OBOZAVAM TE :)";
        let kucanjeTimer = null;

        function ukucajPoruku() {
            const el = document.getElementById("tekst-poruke");
            el.textContent = "";
            let i = 0;
            clearInterval(kucanjeTimer);
            kucanjeTimer = setInterval(() => {
                el.textContent += PORUKA.charAt(i);
                i++;
                if (i >= PORUKA.length) clearInterval(kucanjeTimer);
            }, 110);
        }

        /* ===== SRCA KOJA PADAJU ===== */
        function napraviSrca() {
            const kontejner = document.getElementById("srca-padaju");
            kontejner.innerHTML = "";
            const broj = 40;
            for (let i = 0; i < broj; i++) {
                const s = document.createElement("div");
                s.className = "padajuce-srce";
                s.textContent = Math.random() > 0.5 ? "❤" : "💗";
                s.style.left = Math.random() * 100 + "vw";
                s.style.fontSize = (14 + Math.random() * 26) + "px";
                s.style.animationDuration = (2.5 + Math.random() * 3) + "s";
                s.style.animationDelay = (Math.random() * 2) + "s";
                kontejner.appendChild(s);
            }
        }

        function ocistiSrca() {
            document.getElementById("srca-padaju").innerHTML = "";
        }

        /* ===== PRIKAŽI PORUKU (druga stranica) ===== */
        function prikaziPoruku() {
            document.getElementById("pocetna").style.display = "none";

            const poruka = document.getElementById("poruka");
            poruka.classList.add("aktivna");

            ukucajPoruku();
            napraviSrca();

            /* Pojačaj muziku preko YouTube API-ja */
            try {
                const iframe = document.getElementById("yt-plejer");
                iframe.contentWindow.postMessage(
                    '{"event":"command","func":"setVolume","args":[100]}', '*'
                );
                iframe.contentWindow.postMessage(
                    '{"event":"command","func":"playVideo","args":""}', '*'
                );
            } catch (e) { /* ignorisi */ }
        }

        /* ===== PRIKAŽI TREĆU STRANICU ===== */
        function prikaziTrecu() {
            document.getElementById("poruka").classList.remove("aktivna");
            document.getElementById("treca").classList.add("aktivna");
            clearInterval(kucanjeTimer);
            ocistiSrca();
        }

        /* ===== SRCE EKSPLODIRA NA DODIR ===== */
        document.addEventListener("click", function (e) {
            const srce = document.createElement("div");
            srce.className = "klik-srce";
            srce.textContent = "❤";
            srce.style.left = e.clientX + "px";
            srce.style.top = e.clientY + "px";
            document.body.appendChild(srce);
            setTimeout(() => srce.remove(), 900);
        });
    </script>

</body>
</html>
