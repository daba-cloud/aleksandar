<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PRVA STRANICA: video + dugme -->
    <div id="pocetna">
        <div class="video-kontejner">
            <iframeh
                src="https://youtu.be/4f569AodkkQ?si=QdXX4bs4mhxi0wJS"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <button id="jelena-dugme" onclick="prikaziPoruku()">
            <span class="tekst-dugmeta">KLIKNI JELENA</span>
        </button>
    </div>

    <!-- DRUGA STRANICA: crna sa porukom -->
    <div id="poruka">
        <div class="srce">❤</div>
        <p>OBOZAVAM TE :)</p>
        <div class="srce">❤</div>
    </div>

    <script>
        function prikaziPoruku() {
            document.getElementById("pocetna").style.display = "none";
            document.getElementById("poruka").classList.add("aktivna");
        }
    </script>

</body>
</html>
