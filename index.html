<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            overflow: hidden;
        }

        .stranica {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 30px;
            height: 100%;
            width: 100%;
            text-align: center;
        }

        /* NASLOV */
        .ime-monaha {
            font-size: 38px;
            font-weight: 600;
            letter-spacing: 18px;
            color: #ffffff;
            margin-bottom: 25px;
            padding-left: 18px;
        }

        /* KONTEJNER ZA NAVIGACIJU */
        .dugmad-kontejner {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            width: 100%;
            padding: 0 20px;
        }

        /* STIL ZA SVE LINKOVE U MENIJU (Bez klase dugme-monah) */
        .dugmad-kontejner a {
            display: inline-block;
            color: #888888;
            text-decoration: none;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 3px;
            transition: color 0.3s ease;
            background-color: transparent;
            padding: 5px 0;
            position: relative;
        }

        /* Efekat na hover */
        .dugmad-kontejner a:hover, .dugmad-kontejner a:active {
            color: #ffffff;
        }

        /* Bela linija ispod reči na hover */
        .dugmad-kontejner a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px;
            bottom: -3px;
            left: 0;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .dugmad-kontejner a:hover::after {
            width: 100%;
        }

    </style>
</head>
<body>

    <div class="stranica">
        <h1 class="ime-monaha">Aleksandar</h1>
        
        <!-- Čistiji meni bez nepotrebnih klasa -->
        <div class="dugmad-kontejner">
            <a href="ulaz.html">Portal</a>
            <a href="video.html">YouTube</a>
            <a href="player.html">Video</a>
            <a href="chat.html">Chat</a> <!-- OVDE JE LINK ZA CHAT -->
            <a href="#">Blog</a>
            <a href="#">News</a>
            <a href="tekst.html">Notes</a>
            <a href="audio.html">Audio</a>
        </div>
    </div>

</body>
</html>
