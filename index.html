<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOKUS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="zaglavlje">
        <!-- LEVA STRANA: Tri crtice (Hamburger meni) -->
        <div class="leva-strana">
            <span class="crtice">&#9776;</span>
        </div>

        <!-- SREDINA: FOKUS Logo -->
        <div class="logo-fokus">
            <span>F</span>
            <span>O</span>
            <span>K</span>
            <span>U</span>
            <span>S</span>
        </div>

        <!-- DESNA STRANA: Covek (Profil) - LINIJSKA VERZIJA -->
        <div class="desna-strana">
            <svg viewBox="0 0 24 24" class="ikona-covek" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
    </header>

</body>
</html>
