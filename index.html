    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* GLAVNI ZAGLAVLJE */
        .zaglavlje {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 30px;
            border-bottom: 2px solid #ffffff; /* PRVA LINIJA (Debela) */
        }

        /* NASLOV */
        .ime-monaha {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 12px;
            color: #ffffff;
            margin: 0 0 25px 0;
            padding-left: 12px;
        }

        /* IKONICE U GORNJEM DESNOM UGLU */
        .gornji-ikonice {
            position: absolute;
            top: 35px;
            right: 40px;
            display: flex;
            gap: 20px;
        }

        .gornji-ikonice a {
            color: #ffffff;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gornji-ikonice a:hover {
            opacity: 0.5;
        }

        .gornji-ikonice svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* GLAVNI MENI */
        .dugmad-kontejner {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding-bottom: 20px;
        }

        .dugmad-kontejner a {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 2px;
            transition: opacity 0.3s ease;
            background-color: transparent;
            padding: 5px 0;
            position: relative;
        }

        .dugmad-kontejner a:hover, .dugmad-kontejner a:active {
            opacity: 0.6; 
        }

        .dugmad-kontejner a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px;
            bottom: -3px;
            left: 0;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .dugmad-kontejner a:hover::after {
            width: 100%;
        }

        /* --- NOVI DEO: DRUGA LINIJA --- */
        .druga-linija {
            width: 100%;
            height: 100%; /* Zauzima sav preostali prostor */
            position: relative;
        }

        .druga-linija::before {
            content: '';
            position: absolute;
            top: 40%; /* Pozicija linije na 40% visine ekrana */
            left: 0;
            width: 100%;
            height: 1px; /* Tanka linija */
            background-color: rgba(255, 255, 255, 0.3); /* Blago providna bela */
        }

        /* Prilagođavanje za mobilne telefone */
        @media (max-width: 600px) {
            .ime-monaha {
                font-size: 32px;
                letter-spacing: 8px;
                margin-bottom: 15px;
            }
            .dugmad-kontejner {
                gap: 15px;
            }
            .dugmad-kontejner a {
                font-size: 13px;
            }
            .gornji-ikonice {
                top: 25px;
                right: 15px;
                gap: 15px;
            }
            .gornji-ikonice svg {
                width: 18px;
                height: 18px;
            }
        }

    </style>
</head>
