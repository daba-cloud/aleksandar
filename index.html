<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOKUS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="zaglavlje">
        <!-- LEVA STRANA: Hamburger -->
        <button class="leva-strana" aria-label="Otvori meni">
            <svg viewBox="0 0 24 24" class="ikona-hamburger" aria-hidden="true">
                <path d="M3 6h18M3 12h18M3 18h18"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- SREDINA: FOKUS Logo -->
        <a href="/" class="logo-fokus" aria-label="FOKUS — početna">
            <span>C</span><span>A</span><span>N</span><span>A</span><span>L</span>
        </a>

        <!-- DESNA STRANA: Profil -->
        <button class="desna-strana" aria-label="Profil">
            <svg viewBox="0 0 24 24" class="ikona-covek" aria-hidden="true">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </button>
    </header>

    <main class="sadrzaj">
        <!-- Ovde ide sadržaj -->
    </main>

</body>
</html>
