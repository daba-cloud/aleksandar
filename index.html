<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* GLAVNI ZAGLAVLJE */
        .zaglavlje {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 30px;
            /* BELA I MALO DEBLJA LINIJA */
            border-bottom: 2px solid #ffffff; 
        }

        /* NASLOV */
        .ime-monaha {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 12px;
            color: #ffffff;
            margin: 0 0 25px 0;
            padding-left: 12px;
        }

        /* KONTEJNER ZA NAVIGACIJU */
        .dugmad-kontejner {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding-bottom: 20px;
        }

        /* STIL ZA SVE LINKOVE U MENIJU - SADA SU BELI */
        .dugmad-kontejner a {
            display: inline-block;
            color: #ffffff; /* BELA BOJA */
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 2px;
            transition: opacity 0.3s ease; /* Umesto boje, menjamo providnost */
            background-color: transparent;
            padding: 5px 0;
            position: relative;
        }

        /* Efekat na hover - malo se zatamne ili postanu providni */
        .dugmad-kontejner a:hover, .dugmad-kontejner a:active {
            opacity: 0.6; 
        }

        /* Bela linija ispod reči na hover */
        .dugmad-kontejner a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px;
            bottom: -3px;
            left: 0;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .dugmad-kontejner a:hover::after {
            width: 100%;
        }

        .prazan-prostor {
            flex: 1;
        }

        /* Prilagođavanje za mobilne telefone */
        @media (max-width: 600px) {
            .ime-monaha {
                font-size: 32px;
                letter-spacing: 8px;
                margin-bottom: 15px;
            }
            .dugmad-kontejner {
                gap: 15px;
            }
            .dugmad-kontejner a {
                font-size: 13px;
            }
        }

    </style>
</head>
<body>

    <div class="zaglavlje">
        <h1 class="ime-monaha">Aleksandar</h1>
        
        <div class="dugmad-kontejner">
            <a href="ulaz.html">Portal</a>
            <a href="video.html">YouTube</a>
            <a href="player.html">Video</a>
            <a href="chat.html">Chat</a>
            <a href="#">Blog</a>
            <a href="#">News</a>
            <a href="tekst.html">Notes</a>
            <a href="audio.html">Audio</a>
        </div>
    </div>

    <div class="prazan-prostor"></div>

</body>
</html>
