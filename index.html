<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moj Sajt</title>
    <!-- Ubacujemo CSS direktno ovde da bismo bili 100% sigurni da će raditi -->
    <style>
        body {
            background-color: #000000;
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .meni {
            display: flex;
            gap: 32px;
            padding: 35px 45px;
        }

        .meni a {
            color: #d1d1d1;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .meni a:hover {
            color: #ffffff;
        }

        .video-kontejner {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        video {
            width: 400px;
            max-width: 100%; 
            border-radius: 10px;
            border: 2px solid #333;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <nav class="meni">
        <a href="#">Home</a>
        <a href="#">Live</a>
        <a href="#">About</a>
    </nav>

    <div class="video-kontejner">
        <video controls>
            <source src="moj_video.mp4" type="video/mp4">
            Tvoj pretraživač ne podržava video.
        </video>
    </div>
</body>
</html>
