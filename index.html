<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moj Sajt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="meni">
        <a href="#">Home</a>
        <a href="#">Live</a>
        <a href="#">About</a>
    </nav>

    <!-- Polje za unos i PLAY -->
    <div class="unos-kontejner">
        <input type="text" id="yt-link" placeholder="Nalepi YouTube link...">
        <span class="play-dugme" onclick="pustiVideo()">PLAY</span>
    </div>

    <!-- Prozor gde se pušta video -->
    <div class="video-kontejner">
        <iframe 
            id="yt-plejer"
            src="https://www.youtube.com/embed/zeQC5w7QVls?controls=1&rel=0" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        function pustiVideo() {
            let link = document.getElementById("yt-link").value;
            let videoId = "";

            if (link.includes("youtu.be/")) {
                videoId = link.split("youtu.be/")[1].split("?")[0];
            } else if (link.includes("watch?v=")) {
                videoId = link.split("watch?v=")[1].split("&")[0];
            } else if (link.includes("embed/")) {
                videoId = link.split("embed/")[1].split("?")[0];
            } else {
                alert("Nisam prepoznao link. Molim te nalepi ispravan YouTube link.");
                return;
            }

            document.getElementById("yt-plejer").src = "https://www.youtube.com/embed/" + videoId + "?controls=1&rel=0";
        }

        // Omogućava da pritisneš Enter na tastaturi umesto da klikneš na PLAY
        document.getElementById("yt-link").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                pustiVideo();
            }
        });
    </script>
</body>
</html>
