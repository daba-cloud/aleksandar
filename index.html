<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAGOVANJE</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Mali stil samo za slike u objavama -->
    <style>
        .post-slika {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 0 auto 20px auto; /* Centrira sliku i daje razmak ispod */
            border-radius: 4px; /* Blago zaobljene ivice */
        }
    </style>
</head>
<body>

    <header class="zaglavlje">
        <!-- LEVA STRANA: Tri crtice (Hamburger meni) -->
        <div class="leva-strana">
            <span class="crtice">&#9776;</span>
        </div>

        <!-- SREDINA: TAGOVANJE Logo -->
        <div class="logo-fokus">
            <span>T</span>
            <span>A</span>
            <span>G</span>
            <span>G</span>
            <span>I</span>
            <span>N</span>
            <span>G</span>
        </div>

        <!-- DESNA STRANA: Covek (Profil) -->
        <div class="desna-strana">
            <svg viewBox="0 0 24 24" class="ikona-covek" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
    </header>

    <!-- GLAVNI SADRŽAJ -->
    <main class="feed-container">
        
        <!-- 1. OBJAVA SA SLIKOM -->
        <div class="post">
            <!-- OVDE JE ISPRAVLJENO IME: ТАГ.png (sa ćiriličnim T) -->
            <img src="assets/images/ТАГ.png" alt="Objava 1" class="post-slika">
            
            <div class="post-header">
                <div class="post-avatar">Р</div>
                <div class="post-info">
                    <span class="post-name">РТС</span>
                    <span class="post-time">пре 1 сат</span>
                </div>
            </div>
            
            <div class="post-title">ПРЕНОС ЈАВНОГ СЕРВИСА</div>
            <div class="post-subtitle">ЕКСКЛУЗИВНО</div>
            <div class="post-line"></div>
            <div class="post-excerpt">Ексклузивни снимак дрона са лица места доноси нове детаље на које нисмо били спремни.</div>
        </div>

    </main>

</body>
</html>
