<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Video</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ZAGLAVLJE (Navigacija - isto kao na indexu) */
        .zaglavlje {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #000000;
            z-index: 10;
            gap: 40px;
            height: 70px;
        }

        .nav-dugme {
            color: #888888;
            text-decoration: none;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 3px;
            transition: color 0.3s ease;
            position: relative;
            padding: 5px 0;
        }

        .nav-dugme:hover, .nav-dugme:active {
            color: #ffffff;
        }

        .nav-dugme::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px;
            bottom: -3px;
            left: 0;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .nav-dugme:hover::after {
            width: 100%;
        }

        /* GLAVNI KONTEJNER */
        .video-kontejner {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            gap: 20px;
            overflow-y: auto; /* Dozvoljava skrol ako je potrebno */
        }

        /* OKVIR ZA PLEJER */
        .plejer-okvir {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-color: #111;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .plejer-okvir iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* DISKRETAN PROSTOR ZA UNOS (Samo donja linija) */
        .unos-linka {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-top: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
            flex-shrink: 0;
        }

        #link-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 10px 0;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            outline: none;
            letter-spacing: 1px;
        }

        #link-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* DUGME PLAY (Samo reč) */
        #pusti-dugme {
            background-color: transparent;
            color: #888888;
            border: none;
            padding: 10px 0 10px 20px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 4px;
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
        }

        #pusti-dugme:hover, #pusti-dugme:active {
            color: #ffffff;
        }

        /* PRILAGOĐAVANJE ZA MOBILNE */
        @media (max-width: 600px) {
            .zaglavlje {
                gap: 15px;
                padding: 15px;
                height: 60px;
            }
            .nav-dugme {
                font-size: 12px;
                letter-spacing: 2px;
            }
            .video-kontejner {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="zaglavlje">
        <a href="index.html" class="nav-dugme">Home</a>
        <a href="player.html" class="nav-dugme">Player</a>
        <a href="chat.html" class="nav-dugme">Chat</a>
        <a href="tekst.html" class="nav-dugme">Notes</a>
        <a href="audio.html" class="nav-dugme">Audio</a>
    </div>

    <div class="video-kontejner">
        <!-- Prazan okvir za YouTube plejer -->
        <div class="plejer-okvir" id="plejer"></div>

        <!-- Diskretan unos linka ispod videa -->
        <div class="unos-linka">
            <input type="text" id="link-input" placeholder="Zalepi YouTube link..." autocomplete="off">
            <button id="pusti-dugme">Play</button>
        </div>
    </div>

    <script>
        const inputLink = document.getElementById('link-input');
        const dugmePusti = document.getElementById('pusti-dugme');
        const plejer = document.getElementById('plejer');

        function pustiVideo() {
            const link = inputLink.value.trim();
            
            if (link === "") {
                alert("Zalepi neki YouTube link prvo!");
                return;
            }

            let videoId = null;

            if (link.includes('youtube.com/watch?v=')) {
                videoId = link.split('v=')[1]?.split('&')[0];
            } 
            else if (link.includes('youtu.be/')) {
                videoId = link.split('youtu.be/')[1]?.split('?')[0];
            }
            else if (link.includes('youtube.com/shorts/')) {
                videoId = link.split('shorts/')[1]?.split('?')[0];
            }
            else if (link.includes('youtube.com/embed/')) {
                videoId = link.split('embed/')[1]?.split('?')[0];
            }

            if (videoId) {
                plejer.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                        title="YouTube video player" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                `;
                inputLink.value = ""; 
            } else {
                alert("Link nije prepoznat. Molim te zalepi ispravan YouTube link.");
            }
        }

        dugmePusti.addEventListener('click', pustiVideo);

        inputLink.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                pustiVideo();
            }
        });
    </script>

</body>
</html>
