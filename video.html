<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Video</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* GLAVNI KONTEJNER */
        .video-kontejner {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            gap: 20px;
        }

        /* OKVIR ZA PLEJER - Suptilni sjaj, bez teksta */
        .plejer-okvir {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 80vh;
            background-color: #050505; 
            
            /* Tankа linija i blagi sjaj */
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03), inset 0 0 20px rgba(255, 255, 255, 0.01);
            
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plejer-okvir iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* DISKRETAN PROSTOR ZA UNOS */
        .unos-linka {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 800px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
            margin-top: auto;
            margin-bottom: 20px;
        }

        #link-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 10px 0;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            outline: none;
            text-transform: lowercase;
            letter-spacing: 2px;
        }

        #link-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            text-transform: lowercase;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* DUGME PLAY */
        #pusti-dugme {
            background-color: transparent;
            color: #888888;
            border: none;
            padding: 10px 0 10px 20px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 4px;
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
        }

        #pusti-dugme:hover, #pusti-dugme:active {
            color: #ffffff;
        }

        /* Prilagođavanje za mobilne telefone */
        @media (max-width: 600px) {
            .video-kontejner {
                padding: 10px;
                gap: 10px;
            }
            .unos-linka {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="video-kontejner">
        <!-- Potpuno prazan plejer sa diskretnim sjajem -->
        <div class="plejer-okvir" id="plejer"></div>

        <!-- Diskretan unos linka -->
        <div class="unos-linka">
            <input type="text" id="link-input" placeholder="paste youtube link" autocomplete="off">
            <button id="pusti-dugme">Play</button>
        </div>
    </div>

    <script>
        const inputLink = document.getElementById('link-input');
        const dugmePusti = document.getElementById('pusti-dugme');
        const plejer = document.getElementById('plejer');

        function pustiVideo() {
            const link = inputLink.value.trim();
            
            if (link === "") {
                alert("Paste a YouTube link first!");
                return;
            }

            let videoId = null;

            if (link.includes('youtube.com/watch?v=')) {
                videoId = link.split('v=')[1]?.split('&')[0];
            } 
            else if (link.includes('youtu.be/')) {
                videoId = link.split('youtu.be/')[1]?.split('?')[0];
            }
            else if (link.includes('youtube.com/shorts/')) {
                videoId = link.split('shorts/')[1]?.split('?')[0];
            }
            else if (link.includes('youtube.com/embed/')) {
                videoId = link.split('embed/')[1]?.split('?')[0];
            }

            if (videoId) {
                plejer.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                        title="YouTube video player" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                `;
                inputLink.value = ""; 
            } else {
                alert("Link not recognized. Please paste a valid YouTube link.");
            }
        }

        dugmePusti.addEventListener('click', pustiVideo);

        inputLink.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                pustiVideo();
            }
        });
    </script>

</body>
</html>
