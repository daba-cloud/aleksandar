<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — Video</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'EB Garamond', serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Zaglavlje sa navigacijom */
        .zaglavlje {
            display: flex;
            justify-content: center; /* Centrira dugmad */
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            background-color: #000000;
            z-index: 10;
            gap: 15px; /* Razmak između dugmadi */
        }

        /* Stil za dugmad u navigaciji */
        .nav-dugme {
            color: #ffffff;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            transition: all 0.3s ease;
            background-color: transparent;
            white-space: nowrap;
        }

        .nav-dugme:hover, .nav-dugme:active {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Glavni kontejner za plejer */
        .video-kontejner {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        /* Okvir za YouTube plejer */
        .plejer-okvir {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #111;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .plejer-okvir iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Donji deo za unos linka */
        .unos-linka {
            display: flex;
            width: 100%;
            max-width: 800px;
            gap: 10px;
            padding: 10px 0;
        }

        #link-input {
            flex: 1;
            height: 50px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 10px 15px;
            font-family: 'EB Garamond', serif;
            font-size: 16px;
            outline: none;
            border-radius: 4px;
            text-align: center;
        }

        #pusti-dugme {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            height: 50px;
            padding: 0 25px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            white-space: nowrap;
        }

        #pusti-dugme:hover, #pusti-dugme:active {
            background-color: #ffffff;
            color: #000000;
        }

        /* Prilagođavanje za mobilne telefone */
        @media (max-width: 600px) {
            .unos-linka {
                flex-direction: column;
            }
            #pusti-dugme {
                width: 100%;
            }
            .plejer-okvir {
                border-radius: 4px;
            }
            /* Na mobilnom malo smanjujemo dugmad da stanu u jedan red */
            .nav-dugme {
                font-size: 10px;
                padding: 6px 12px;
            }
            .zaglavlje {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="zaglavlje">
        <a href="index.html" class="nav-dugme">Home</a>
        <a href="ulaz.html" class="nav-dugme">Portal</a>
        <a href="chat.html" class="nav-dugme">Chat</a>
    </div>

    <div class="video-kontejner">
        <!-- Prazan okvir za plejer -->
        <div class="plejer-okvir" id="plejer"></div>

        <!-- Polje za unos linka -->
        <div class="unos-linka">
            <input type="text" id="link-input" placeholder="" autocomplete="off">
            <button id="pusti-dugme">PLAY</button>
        </div>
    </div>

    <script>
        const inputLink = document.getElementById('link-input');
        const dugmePusti = document.getElementById('pusti-dugme');
        const plejer = document.getElementById('plejer');

        function pustiVideo() {
            const link = inputLink.value.trim();
            
            if (link === "") {
                alert("Zalepi neki YouTube link prvo!");
                return;
            }

            let videoId = null;

            if (link.includes('youtube.com/watch?v=')) {
                videoId = link.split('v=')[1]?.split('&')[0];
            } 
            else if (link.includes('youtu.be/')) {
                videoId = link.split('youtu.be/')[1]?.split('?')[0];
            }
            else if (link.includes('youtube.com/shorts/')) {
                videoId = link.split('shorts/')[1]?.split('?')[0];
            }
            else if (link.includes('youtube.com/embed/')) {
                videoId = link.split('embed/')[1]?.split('?')[0];
            }

            if (videoId) {
                plejer.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                        title="YouTube video player" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                `;
                inputLink.value = "";
            } else {
                alert("Link nije prepoznat. Molim te zalepi ispravan YouTube link.");
            }
        }

        dugmePusti.addEventListener('click', pustiVideo);

        inputLink.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                pustiVideo();
            }
        });
    </script>

</body>
</html>
