<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleksandar — YouTube</title>
    
    <!-- Barlow Condensed Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            color: #ffffff;
            font-family: 'Barlow Condensed', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* GLAVNI KONTEJNER */
        .video-kontejner {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        /* OKVIR ZA PLEJER - BEZ IKAKVIH LINIJA */
        .plejer-okvir {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 80vh;
            background-color: #000000;
            border: none;
            box-shadow: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .plejer-okvir iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* PROSTOR ZA UNOS LINKOVA ISPOD VIDEJA */
        .unos-linka {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        #link-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 10px 0;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            outline: none;
            text-transform: lowercase;
            letter-spacing: 4px; /* Veći razmak između slova */
            text-align: center; /* Centrirano */
        }

        #link-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            text-transform: lowercase;
            letter-spacing: 4px;
            font-weight: 300;
        }

        /* Prilagođavanje za mobilne telefone */
        @media (max-width: 600px) {
            .video-kontejner {
                padding: 10px;
            }
            #link-input {
                font-size: 16px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <div class="video-kontejner">
        <!-- Plejer bez linija -->
        <div class="plejer-okvir" id="plejer"></div>

        <!-- Prostor za unos linka ispod videa -->
        <div class="unos-linka">
            <input type="text" id="link-input" placeholder="paste youtube link" autocomplete="off">
        </div>
    </div>

    <script>
        const inputLink = document.getElementById('link-input');
        const plejer = document.getElementById('plejer');

        function pustiVideo() {
            const link = inputLink.value.trim();
            
            // Ako je polje prazno, ništa se ne dešava
            if (link === "") return;

            let videoId = null;

            if (link.includes('youtube.com/watch?v=')) {
                videoId = link.split('v=')[1]?.split('&')[0];
            } 
            else if (link.includes('youtu.be/')) {
                videoId = link.split('youtu.be/')[1]?.split('?')[0];
            }
            else if (link.includes('youtube.com/shorts/')) {
                videoId = link.split('shorts/')[1]?.split('?')[0];
            }
            else if (link.includes('youtube.com/embed/')) {
                videoId = link.split('embed/')[1]?.split('?')[0];
            }

            if (videoId) {
                // Ubacujemo iframe
                plejer.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                        title="YouTube video player" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                `;
                // Čistimo polje za unos nakon puštanja
                inputLink.value = ""; 
            } else {
                alert("Link not recognized. Please paste a valid YouTube link.");
            }
        }

        // Slušamo pritisak na Enter
        inputLink.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                pustiVideo();
            }
        });
    </script>

</body>
</html>
